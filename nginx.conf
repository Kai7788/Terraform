events {}

http {
    include /etc/nginx/mime.types;

    # --------------------------
    # Pi-hole
    # --------------------------
    server {
        listen 80;
        server_name pihole.lan;

        location / {
            proxy_pass http://pihole:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # --------------------------
    # Nextcloud
    # --------------------------
    server {
        listen 80;
        server_name nextcloud.lan;
        client_max_body_size 10G;  # Für große Datei-Uploads

        location / {
            proxy_pass http://nextcloud:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / Nextcloud Upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;

            # Sicherheitsheader
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Robots-Tag "none" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }

    # --------------------------
    # YouTube Converter Service
    # --------------------------
    server {
        listen 80;
        server_name converter.lan;

        # Frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /convert {
            proxy_pass http://yt_converter:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts für lange Konvertierungen
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
